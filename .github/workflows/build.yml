name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and release build
        run: gradle test assembleRelease -PversionCode=${{ github.run_number }} -PversionName=0.2.${{ github.run_number }}

      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: moi-napitki-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release with stable APK link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Мои Напитки 0.2.${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            Сборка №${{ github.run_number }} из коммита ${{ github.sha }}.
            Ставится поверх предыдущей версии, если ключ подписи тот же.
